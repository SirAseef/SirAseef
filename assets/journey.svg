" >Software Engineer &amp; Scrum Master</text><line x1="828" y1="186" x2="1140" y2="186" stroke="#3A2E0A"/><circle cx="834" cy="206" r="3" fill="#F5B301"/><text x="846" y="210" class="t" font-size="14" font-weight="400" fill="#EDE6D6" text-anchor="start" >Node.js · Express · MongoDB</text><circle cx="834" cy="232" r="3" fill="#F5B301"/><text x="846" y="236" class="t" font-size="14" font-weight="400" fill="#EDE6D6" text-anchor="start" >ASP.NET Core MVC (C#) · Python ML</text></g><g class="float" style="animation-delay:-2.7s"><rect x="804" y="330" width="360" height="196" rx="16" fill="#121015" stroke="#F5B301" stroke-opacity=".35"/><rect x="804" y="330" width="6" height="196" rx="3" fill="url(#gold)"/><text x="828" y="364" class="m" font-size="13" fill="#E8860C" font-weight="700">Sep 2023 – Dec 2024</text><rect x="1069.2" y="348" width="78.8" height="22" rx="11" fill="#1C170C" stroke="#F5B301" stroke-opacity=".6"/><text x="1108.6" y="363" class="t" font-size="11" font-weight="800" fill="#FFD54A" text-anchor="middle" letter-spacing="1">ACADEMIA</text><text x="828" y="400" class="t" font-size="20" font-weight="700" fill="#FFFFFF" text-anchor="start" >Aptech North Karachi</text><text x="828" y="428" class="t" font-size="15.5" font-weight="600" fill="#FFD54A" text-anchor="start" >Faculty Member</text><line x1="828" y1="446" x2="1140" y2="446" stroke="#3A2E0A"/><circle cx="834" cy="466" r="3" fill="#F5B301"/><text x="846" y="470" class="t" font-size="14" font-weight="400" fill="#EDE6D6" text-anchor="start" >Taught 150+ students</text><circle cx="834" cy="492" r="3" fill="#F5B301"/><text x="846" y="496" class="t" font-size="14" font-weight="400" fill="#EDE6D6" text-anchor="start" >Trained 5 faculty every 3 months</text></g><g class="float" style="animation-delay:-3.6s"><rect x="420" y="330" width="360" height="196" rx="16" fill="#121015" stroke="#F5B301" stroke-opacity=".35"/><rect x="420" y="330" width="6" height="196" rx="3" fill="url(#gold)"/><text x="444" y="364" class