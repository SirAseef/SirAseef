" font-weight="400" fill="#EDE6D6" text-anchor="start" >Coursework complete</text><circle cx="66" cy="492" r="3" fill="#F5B301"/><text x="78" y="496" class="t" font-size="14" font-weight="400" fill="#EDE6D6" text-anchor="start" >Thesis in progress: HeatFlood Sentinel</text></g>
